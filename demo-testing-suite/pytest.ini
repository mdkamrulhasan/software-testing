[pytest]
# Lets tests import the app/ package directly (e.g. `from app.billing...`)
# without needing `pip install -e .` first. Requires pytest >= 7.0.
pythonpath = .

# Only collect tests/ by default. demos/ holds deliberately illustrative
# (and in one case deliberately flaky) examples that are meant to be run
# explicitly by path during lecture, not swept into the "real" suite.
testpaths = tests

# Marker registration -- referenced on the "Beyond Today: Organizing a
# Growing Suite" slide. Registering markers here means `pytest --markers`
# documents them, and pytest warns instead of silently ignoring a typo.
markers =
    unit: fast, isolated unit tests with no I/O
    slow: tests slow enough to skip during rapid local iteration
